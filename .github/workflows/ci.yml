name: AIRecruit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Syntax check
        working-directory: backend
        run: python -m py_compile app/main.py && echo 'Backend syntax OK'

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit || true
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify security middleware
        run: |
          grep -l 'SecurityHeadersMiddleware' backend/app/main.py && echo 'Security headers middleware present'
          grep -l 'RateLimitMiddleware\|rate_limit' backend/app/main.py && echo 'Rate limiter present'
          grep -l 'CSRFMiddleware\|csrf' backend/app/main.py && echo 'CSRF middleware present'
          grep -l 'AuditMiddleware\|audit' backend/app/main.py && echo 'Audit middleware present'
