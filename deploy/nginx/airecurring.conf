# AIRecruiting reverse proxy for airecurring.com
# Frontend (Next.js) runs on 127.0.0.1:3000, backend (FastAPI) on 127.0.0.1:8000.
# Place in /etc/nginx/sites-available/ and symlink into sites-enabled/.
# After DNS points app./admin. -> 139.180.223.225, run certbot to add HTTPS:
#   sudo certbot --nginx -d app.airecurring.com -d admin.airecurring.com -d airecurring.com -d www.airecurring.com

# ---- Admin panel subdomain: admin.airecurring.com (root redirects to /admin) ----
server {
    listen 80;
    listen [::]:80;
    server_name admin.airecurring.com;

    client_max_body_size 200m;

    location = / { return 302 /admin; }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Main app: app.airecurring.com (+ apex and www) ----
server {
    listen 80;
    listen [::]:80;
    server_name app.airecurring.com airecurring.com www.airecurring.com;

    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
